<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    #container { width: 100vw; height: 100vh; overflow: hidden; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  } }
  </script>
</head>
<body>
<div id="container"></div>
<script type="module">
  import * as THREE from "three";
  import { MindARThree } from "mindar-image-three";

  // ① 自作の指紋データベースを指定
  const mindarThree = new MindARThree({
    container: document.querySelector("#container"),
    imageTargetSrc: "./targets.mind",   // ← 工程Bで作ったファイル
    maxTrack: 1,                        // 同時追跡数（歩き回り用途は1で十分）
  });
  const { renderer, scene, camera } = mindarThree;

  // ② 日本語ラベル製造機：Canvasに描いた文字を「看板」にする
  function makeLabel(title, lines) {
    const cv = document.createElement("canvas");
    cv.width = 1024; cv.height = 512;
    const g = cv.getContext("2d");
    g.fillStyle = "rgba(20,60,45,0.85)";  g.fillRect(0, 0, 1024, 512);  // 深緑パネル
    g.fillStyle = "#8ac53f";              g.fillRect(0, 0, 22, 512);    // 左の色バー
    g.fillStyle = "#ffffff";
    g.font = "bold 90px sans-serif";      g.fillText(title, 60, 130);
    g.font = "54px sans-serif";
    lines.forEach((t, i) => g.fillText(t, 60, 250 + i * 85));
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(cv), transparent: true
    }));
    sp.scale.set(1.5, 0.75, 1);   // 看板寸法（マーカー幅=1基準）
    return sp;
  }

  // ③ 機器台帳：登録No ↔ 表示内容（コンパイラ投入順＝No）
  const devices = [
    { no: 0, title: "キーボード", lines: ["接続: USB", "配列: JIS", "掃除: 月1でエアダスター"] },
  ];

  // ④ 台帳をアンカーへ一括紐づけ
  for (const d of devices) {
    const anchor = mindarThree.addAnchor(d.no);
    const label = makeLabel(d.title, d.lines);
    label.position.set(0, 0.7, 0.3);   // マーカーの少し上・手前に浮かべる
    anchor.group.add(label);
    anchor.onTargetFound = () => console.log("発見:", d.title);
  }

  // ⑤ 起動
  const start = async () => {
    await mindarThree.start();
    renderer.setAnimationLoop(() => renderer.render(scene, camera));
  };
  start();
</script>
</body>
